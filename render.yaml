services:
  - type: web
    name: tennis-court-finder
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONIOENCODING
        value: utf-8
      - key: HOST
        value: 0.0.0.0
